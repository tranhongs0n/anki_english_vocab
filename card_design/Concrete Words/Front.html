<div class="container">
  {{#Image}}
  <!-- Cards WITH Image: Image is prompt -->
  <div class="image-slot">
    {{Image}}
  </div>
  <div class="word-slot">
    {{type:Word}}
  </div>
  {{/Image}}

  {{^Image}}
  <!-- Cards WITHOUT Image: Word is prompt -->
  <div class="word-slot">
    <div class="word">{{Word}}</div>
    {{type:Word}}
  </div>
  {{/Image}}
</div>
